<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Online Course Registration</title>
</head>
<body>
    <h1>Online Course Registration Form</h1>

    <form action="submit_course.php" method="POST" target="_self" enctype="multipart/form-data">

        <!-- Task 7: Hidden Field -->
        <input type="hidden" name="form_title" value="Online Course Registration">

        <!-- Task 2 & 3: Text Inputs with Labels -->
        <p>
            <label for="student_name">Student Name *:</label><br>
            <input type="text" id="student_name" name="student_name" placeholder="Enter full name" required>
        </p>

        <p>
            <label for="email">Email Address *:</label><br>
            <input type="email" id="email" name="email" placeholder="example@domain.com" required>
        </p>

        <p>
            <label for="mobile">Mobile Number *:</label><br>
            <input type="tel" id="mobile" name="mobile" placeholder="10-digit phone number" required>
        </p>

        <p>
            <label for="age">Age:</label><br>
            <input type="number" id="age" name="age" min="15" max="100">
        </p>

        <p>
            <label for="password">Password *:</label><br>
            <input type="password" id="password" name="password" placeholder="Create a password" required>
        </p>

        <!-- Task 8: Date and Time -->
        <p>
            <label for="dob">Date of Birth:</label><br>
            <input type="date" id="dob" name="dob">
        </p>

        <p>
            <label for="class_time">Preferred Class Time:</label><br>
            <input type="time" id="class_time" name="class_time">
        </p>

        <!-- Task 4: Radio Buttons -->
        <p>
            <label>Gender *:</label><br>
            <input type="radio" id="male" name="gender" value="Male" required>
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>
            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Other</label>
        </p>

        <!-- Task 5: Checkboxes -->
        <p>
            <label>Skills:</label><br>
            <input type="checkbox" id="html" name="skills[]" value="HTML">
            <label for="html">HTML</label>
            <input type="checkbox" id="css" name="skills[]" value="CSS">
            <label for="css">CSS</label>
            <input type="checkbox" id="js" name="skills[]" value="JavaScript">
            <label for="js">JavaScript</label>
            <input type="checkbox" id="python" name="skills[]" value="Python">
            <label for="python">Python</label>
        </p>

        <!-- Task 6: Dropdown -->
        <p>
            <label for="course">Select Course *:</label><br>
            <select id="course" name="course" required>
                <option value="">-- Choose a Course --</option>
                <option value="Web Development">Web Development</option>
                <option value="Python Programming">Python Programming</option>
                <option value="Data Analytics">Data Analytics</option>
                <option value="Digital Marketing">Digital Marketing</option>
            </select>
        </p>

        <!-- Task 10: File Upload -->
        <p>
            <label for="document">Upload Photo/Document:</label><br>
            <input type="file" id="document" name="document" accept="image/*,.pdf">
        </p>

        <!-- Task 9: Textarea -->
        <p>
            <label for="address">Address / Additional Information:</label><br>
            <textarea id="address" name="address" rows="4" cols="50" placeholder="Enter your full address or remarks"></textarea>
        </p>

        <!-- Task 12: Buttons -->
        <p>
            <input type="submit" value="Register Now">
            <input type="reset" value="Reset Form">
        </p>
    </form>
</body>
</html>
